<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PATACREA — L’usine à créatures</title>
<meta name="description" content="Crée, anime, fusionne et range tes propres monstres dans un petit monde. Un jeu de créativité 100 % dans le navigateur.">
<meta name="theme-color" content="#ffd93d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👾%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#2b1d3a;--bg:#fff6df;--pink:#ff5fa2;--blue:#4cc9f0;--yellow:#ffd93d;--green:#6bd66f;--purple:#a07bff;--orange:#ff9f43;--r:20px;--sh:0 4px 0 var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;
 background:radial-gradient(circle at 8% 8%,#ffe9a8 0,transparent 36%),radial-gradient(circle at 92% 18%,#cdeeff 0,transparent 36%),radial-gradient(circle at 50% 100%,#ffd6ec 0,transparent 42%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:999}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 4px;max-width:1150px;margin:0 auto}
.brand p{font-weight:700;opacity:.75;font-size:14px;margin-top:2px}
#logo{font-size:clamp(30px,7vw,50px);line-height:1;letter-spacing:1px;display:flex}
#logo span{display:inline-block;text-shadow:0 3px 0 var(--ink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:logo 2.6s ease-in-out infinite}
#logo span:hover{animation:wob .45s}
@keyframes logo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wob{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-14deg) scale(1.3)}60%{transform:rotate(10deg) scale(1.2)}100%{transform:rotate(0) scale(1)}}

/* Boutons */
.btn{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:9px 14px;box-shadow:var(--sh);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-weight:800;transition:transform .08s,box-shadow .08s,background .15s;user-select:none;-webkit-user-select:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible,.sw:focus-visible,.pitem:focus-visible,.ptile:focus-visible,.cthumb:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 11px;min-height:40px;font-size:14px;border-radius:14px}
.btn.big{font-size:20px;padding:12px 24px;min-height:54px}
.btn.pink{background:var(--pink);color:#fff}.btn.blue{background:var(--blue)}.btn.yellow{background:var(--yellow)}.btn.green{background:var(--green)}.btn.purple{background:var(--purple);color:#fff}.btn.orange{background:var(--orange)}
.btn[aria-pressed=true]{background:var(--yellow);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.tg[aria-pressed=true]{background:var(--green)}
.btn.chip[aria-selected=true]{background:var(--ink);color:#fff}

/* Navigation */
#tabs{display:flex;gap:10px;justify-content:center;padding:8px 12px;flex-wrap:wrap}
.tabbtn[aria-selected=true]{background:var(--pink);color:#fff;transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.tabbtn .badge{background:var(--ink);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;min-width:20px}
@media(max-width:899px){
 #tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:3px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex-wrap:nowrap;gap:4px;justify-content:space-around}
 .tabbtn{flex:1;flex-direction:column;gap:0;padding:4px 2px;box-shadow:none;border-radius:12px;font-size:12px;line-height:1.15;min-height:52px;border-color:transparent}
 .tabbtn .ti{font-size:22px}
 .tabbtn[aria-selected=true]{border-color:var(--ink);transform:none;box-shadow:none}
}
main{max-width:1150px;margin:0 auto;padding:8px 12px 110px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.bar h2{font-size:24px}
.hint{font-weight:700;opacity:.75;font-size:14px;margin:8px 2px}
.pt{margin:14px 0 2px;font-size:17px}

/* Créateur */
.create-grid{display:grid;gap:12px;grid-template-columns:1fr}
.stage-col{position:sticky;top:0;z-index:20;padding-top:4px}
.stage-card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:8px 10px 4px}
.name-in{width:100%;text-align:center;font-weight:800;font-size:20px;border:3px dashed var(--ink);border-radius:14px;padding:6px 10px;background:#fffbe9;min-height:44px}
.name-in:focus{outline:4px solid var(--blue);border-style:solid}
.stage{position:relative;height:clamp(170px,27vh,260px);margin:6px 0;border-radius:16px;display:grid;place-items:center;cursor:pointer;
 background:radial-gradient(ellipse at 50% 92%,#b8f0a8 0 28%,transparent 29%),radial-gradient(circle,rgba(255,255,255,.7) 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(#bfe9ff,#fff3d1)}
.stage svg{height:100%;width:100%;overflow:visible;display:block}
.stage.pop svg{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .btn{flex:0 0 auto}
.sep{flex:0 0 2px;background:var(--ink);opacity:.2;border-radius:2px;margin:4px 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips .btn{flex:0 0 auto}
.panel{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:6px 12px 14px}
.panel h3{margin:14px 0 8px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tile,.ptile,.pitem{border:3px solid var(--ink);border-radius:14px;background:#fff7e0;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.tile small,.ptile small,.pitem small{font-size:11px;font-weight:800;text-align:center;line-height:1.1;padding:0 2px;overflow-wrap:anywhere}
.tile:hover,.ptile:hover,.pitem:hover{background:#ffeaa0}
.tile.on{background:var(--yellow);box-shadow:0 3px 0 var(--ink);transform:scale(1.04)}
.tsvg{width:100%;aspect-ratio:1/1;display:block}
.tsvg svg{width:100%;height:100%;display:block}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0;position:relative;box-shadow:0 2px 0 var(--ink)}
.sw.on{outline:4px solid var(--pink);outline-offset:2px;transform:scale(1.08)}
.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden;display:block}
.sw.custom input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;cursor:pointer}
@media(min-width:900px){
 .create-grid{grid-template-columns:minmax(340px,430px) 1fr;align-items:start;gap:18px}
 .stage-col{top:12px}
 .stage{height:clamp(300px,50vh,430px)}
 .strip{flex-wrap:wrap;overflow:visible}
}

/* Fusion */
.fusion{display:grid;gap:12px}
.fstage{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px;background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.slot b{font-size:16px;overflow-wrap:anywhere}
.slotsvg{width:100%;height:clamp(130px,24vh,210px);display:grid;place-items:center}
.slotsvg svg{height:100%;width:100%;overflow:visible}
.slotsvg.empty{font-size:60px}
.plus{font-size:34px;font-weight:900}
.swirl{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;opacity:0;pointer-events:none;background:conic-gradient(#ff5fa2,#ffd93d,#6bd66f,#4cc9f0,#a07bff,#ff5fa2);-webkit-mask:radial-gradient(circle,transparent 0 18%,#000 19% 70%,transparent 71%);mask:radial-gradient(circle,transparent 0 18%,#000 19% 70%,transparent 71%)}
.merging .swirl{animation:swirl 1.25s ease-in forwards}
.merging #slotA .slot-in{animation:mergeL 1.25s ease-in forwards}
.merging #slotB .slot-in{animation:mergeR 1.25s ease-in forwards}
.merging .plus{animation:fade 1s forwards}
@keyframes swirl{0%{transform:scale(0) rotate(0);opacity:1}100%{transform:scale(1.7) rotate(900deg);opacity:.95}}
@keyframes mergeL{0%{transform:none}60%{transform:translateX(55%) rotate(200deg) scale(.7)}100%{transform:translateX(90%) rotate(540deg) scale(0);opacity:0}}
@keyframes mergeR{0%{transform:none}60%{transform:translateX(-55%) rotate(-200deg) scale(.7)}100%{transform:translateX(-90%) rotate(-540deg) scale(0);opacity:0}}
@keyframes fade{to{opacity:0}}
.fres{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:12px;display:grid;gap:8px;justify-items:center;text-align:center;min-height:120px;align-content:center;background:linear-gradient(135deg,#fff,#fff0fb)}
.fres .slotsvg{height:clamp(170px,30vh,260px);max-width:320px}
.fres.reveal .slotsvg{animation:reveal .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes reveal{0%{transform:scale(0) rotate(-180deg)}100%{transform:none}}
.fres .name-in{max-width:320px}

/* Monde */
.world-svg{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);touch-action:none;user-select:none;-webkit-user-select:none;background:#cdeeff}
.world-svg [data-iid]{cursor:grab}
.world-svg [data-iid]:active{cursor:grabbing}
#ring{pointer-events:none}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding:8px 10px;background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh)}
.selbar b{margin-right:4px}
.palette{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.ptile{flex:0 0 86px}
.ptile svg{width:100%;aspect-ratio:1/1;display:block}
.art.new{animation:drop .5s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes drop{0%{transform:translateY(-70px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
.puff{animation:puff 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
.p2{animation-delay:1s}.p3{animation-delay:2s}
@keyframes puff{from{opacity:.9;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-28px) scale(1.5)}}
.flame{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.14)}}

/* Collection */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.card h3{font-size:17px;overflow-wrap:anywhere}
.cthumb{border:0;background:linear-gradient(#e3f6ff,#fff6d6);border-radius:14px;width:100%;height:170px;padding:6px;cursor:pointer}
.cthumb svg{width:100%;height:100%;overflow:visible}
.cbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cbtns .btn{min-height:36px;padding:4px 9px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.empty-state{grid-column:1/-1;text-align:center;padding:30px 10px;background:#fff;border:3px dashed var(--ink);border-radius:var(--r);display:grid;gap:12px;justify-items:center;font-weight:700}
.empty-state .big-emoji{font-size:64px}

/* Fenêtres, messages, effets */
.backdrop{position:fixed;inset:0;background:rgba(43,29,58,.55);display:grid;place-items:center;z-index:100;padding:14px}
.modal{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:16px;width:min(440px,100%);max-height:88vh;overflow:auto;animation:pop .25s}
.modal.wide{width:min(640px,100%)}
.modal h2{font-size:22px;margin-bottom:8px}
.modal p{margin:6px 0;font-weight:600}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.big-emoji{display:grid;place-items:center;font-size:44px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.bgopt{border:3px solid var(--ink);border-radius:14px;min-height:80px;cursor:pointer;font-weight:800}
.bgopt span{background:rgba(255,255,255,.85);padding:2px 8px;border-radius:99px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;text-align:center;font-weight:800}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){#toast{bottom:30px}}
.fx{position:fixed;pointer-events:none;z-index:150;animation:fly 1.2s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}

/* ===== Animations des créatures ===== */
.cr,.shadow,.eyes,.arm-l,.arm-r,.leg-l,.leg-r,.wing-l,.wing-r,.zzz text,.notes text,.steam circle,.tear{transform-box:fill-box}
.cr{transform-origin:50% 100%}
.shadow{transform-origin:50% 50%}
.eyes{transform-origin:50% 50%}
.arm-l{transform-origin:100% 5%}.arm-r{transform-origin:0% 5%}
.wing-l{transform-origin:100% 70%}.wing-r{transform-origin:0% 70%}
.leg-l,.leg-r{transform-origin:50% 0%}
.pupil{transform:translate(var(--px,0px),var(--py,0px));transition:transform .08s}
.live .cr{animation:breathe 3.2s ease-in-out infinite}
.live .eyes{animation:blink 4.5s infinite}
.live .wing-l{animation:flapL 1.5s ease-in-out infinite}
.live .wing-r{animation:flapR 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes flapL{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-14deg)}}
@keyframes flapR{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
.mood-dance .cr{animation:dance .6s ease-in-out infinite alternate}
.mood-dance .arm-l{animation:waveL .3s ease-in-out infinite alternate}
.mood-dance .arm-r{animation:waveR .3s ease-in-out infinite alternate}
.mood-dance .leg-l{animation:stepL .3s ease-in-out infinite alternate}
.mood-dance .leg-r{animation:stepR .3s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-10px)}}
@keyframes waveL{from{transform:rotate(10deg)}to{transform:rotate(85deg)}}
@keyframes waveR{from{transform:rotate(-10deg)}to{transform:rotate(-85deg)}}
@keyframes stepL{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes stepR{from{transform:translateY(-8px)}to{transform:translateY(0)}}
.mood-jump .cr{animation:jump .8s ease-in-out infinite}
.mood-jump .shadow{animation:shadowj .8s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-52px) scale(.92,1.1)}75%{transform:translateY(0) scale(1.1,.88)}100%{transform:translateY(0) scale(1,1)}}
@keyframes shadowj{0%,100%{transform:scale(1)}45%{transform:scale(.55);opacity:.08}}
.mood-sleep .cr{animation:sleep 3.4s ease-in-out infinite}
.mood-sleep .wing-l,.mood-sleep .wing-r,.mood-sleep .eyes{animation:none}
@keyframes sleep{0%,100%{transform:rotate(3deg) scale(1,.985)}50%{transform:rotate(3deg) scale(1.02,1.025)}}
.zzz text,.notes text{opacity:0;animation:zfloat 2.6s ease-in infinite}
.zzz text:nth-child(2),.notes text:nth-child(2){animation-delay:.6s}
.zzz text:nth-child(3),.notes text:nth-child(3){animation-delay:1.2s}
@keyframes zfloat{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-26px)}}
.mood-laugh .cr{animation:laugh .28s ease-in-out infinite alternate}
.mood-laugh .eyes{animation:none}
@keyframes laugh{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-6px) rotate(2deg)}}
.tear{animation:tear 1s ease-in infinite}
@keyframes tear{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(24px)}}
.mood-angry .cr{animation:shake .12s linear infinite}
.mood-angry .eyes{animation:none}
@keyframes shake{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}
.steam circle{animation:steam 1s ease-out infinite}
.steam circle:nth-child(2){animation-delay:.35s}.steam circle:nth-child(3){animation-delay:.7s}
@keyframes steam{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-28px) scale(1.5)}}
.card:hover .cr,.pitem:hover .cr{animation:dance .6s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.live .cr,.live .eyes,.live .wing-l,.live .wing-r,#logo span{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <div class="brand"><h1 id="logo" aria-label="PATACREA"></h1><p>L’usine à créatures</p></div>
  <button id="sndBtn" class="btn small" aria-pressed="true" aria-label="Son activé" title="Son">🔊</button>
</header>
<nav id="tabs" role="tablist" aria-label="Sections du jeu">
  <button class="btn tabbtn" role="tab" data-view="create"><span class="ti">🎨</span><span>Créer</span></button>
  <button class="btn tabbtn" role="tab" data-view="fusion"><span class="ti">🌀</span><span>Fusion</span></button>
  <button class="btn tabbtn" role="tab" data-view="world"><span class="ti">🌳</span><span>Monde</span></button>
  <button class="btn tabbtn" role="tab" data-view="coll"><span class="ti">📚</span><span>Collection <span class="badge" id="collBadge" hidden></span></span></button>
</nav>

<main id="main">
  <!-- ===== CRÉER ===== -->
  <section class="view" id="v-create">
    <div class="create-grid">
      <div class="stage-col"><div class="stage-card">
        <input id="nameIn" class="name-in" maxlength="18" autocomplete="off" aria-label="Nom de ta créature" placeholder="Nom de ta créature">
        <div id="stage" class="stage live mood-idle" title="Touche ta créature !"></div>
        <div class="strip" id="strip">
          <button class="btn small" data-mood="dance" aria-pressed="false">💃 Danse</button>
          <button class="btn small" data-mood="jump" aria-pressed="false">🦘 Saut</button>
          <button class="btn small" data-mood="sleep" aria-pressed="false">😴 Dodo</button>
          <button class="btn small" data-mood="laugh" aria-pressed="false">😂 Rire</button>
          <button class="btn small" data-mood="angry" aria-pressed="false">😡 Colère</button>
          <span class="sep"></span>
          <button class="btn small yellow" id="bRand">🎲 Hasard</button>
          <button class="btn small green" id="bSave">💾 Sauver</button>
          <button class="btn small" id="bNew">🆕 Nouvelle</button>
          <button class="btn small blue" id="bPng">🖼️ Image</button>
        </div>
      </div></div>
      <div class="ctl-col">
        <div class="chips" id="groupTabs" role="tablist" aria-label="Catégories de personnalisation"></div>
        <div class="panel" id="panel"></div>
      </div>
    </div>
  </section>

  <!-- ===== FUSION ===== -->
  <section class="view" id="v-fusion" hidden>
    <div class="bar"><h2>🌀 La fusion magique</h2></div>
    <div class="fusion">
      <div class="fstage" id="fStage">
        <div class="slot" id="slotA"><div class="slot-in"></div><button class="btn small" data-pick="a">🔄 Changer</button></div>
        <div class="plus">＋</div>
        <div class="slot" id="slotB"><div class="slot-in"></div><button class="btn small" data-pick="b">🔄 Changer</button></div>
        <div class="swirl"></div>
      </div>
      <div style="text-align:center"><button class="btn big pink" id="fuseBtn">✨ FUSIONNER ! ✨</button></div>
      <div class="fres" id="fRes"></div>
    </div>
  </section>

  <!-- ===== MONDE ===== -->
  <section class="view" id="v-world" hidden>
    <div class="bar"><h2>🌳 Ton petit monde</h2><div class="chips" id="themeBar"></div></div>
    <svg id="world" class="world-svg" viewBox="0 0 800 520" role="img" aria-label="Ton monde : touche et glisse les objets pour les déplacer"></svg>
    <div id="selBar" class="selbar" hidden>
      <b id="selName"></b>

<script>
'use strict';
/* ==========================================================
   PATACREA — L’usine à créatures
   Un seul fichier : HTML + CSS + JavaScript, aucune dépendance.

   4 Sons & effets · 5 État & sauvegarde · 6 Créateur · 7 Fusion
   8 Monde · 9 Collection & export · 10 Démarrage
   ========================================================== */

/* ---------- 1. Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v;};
let UID=0;

function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function rgb2hex(a){return '#'+a.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t));}
function shade(c,t){return t<0?mix(c,'#000000',-t):mix(c,'#ffffff',t);}
function star(x,y,R,r,n=5){const p=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,d=i%2?r:R;p.push((x+Math.cos(a)*d).toFixed(1)+','+(y+Math.sin(a)*d).toFixed(1));}return p.join(' ');}
function slug(s){return (String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase())||'creature';}
const SYL=['Pata','Blu','Zo','Mi','Kro','Fli','Gru','Pou','Nou','Bi','Ta','Lo','Ska','Mou','Dou','Ki','Wa','Zi','Chou','Pim','Bob','Gli','Ploc','Toto'];
function randName(){let n='';const k=2+Math.floor(Math.random()*2);for(let i=0;i<k;i++)n+=pick(SYL).toLowerCase();return (n[0].toUpperCase()+n.slice(1)).slice(0,14);}
function fuseName(a,b){const x=a.slice(0,Math.max(2,Math.ceil(a.length/2))),y=b.slice(-Math.max(2,Math.floor(b.length/2)));const n=x+y.toLowerCase();return (n[0].toUpperCase()+n.slice(1)).slice(0,18);}

/* ---------- 2. Données ---------- */
const PALETTE=['#ff6b6b','#ff9f43','#ffd93d','#8bd450','#2ecc9a','#4cc9f0','#4d7cff','#9b6bff','#ff6bd5','#ff8fab','#b8864b','#f5f0e6','#6b7280','#2d2a3e'];
const OPT={
 shape:[['round','Rond'],['blob','Patate'],['egg','Œuf'],['square','Cube'],['cone','Cône'],['bean','Haricot']],
 pattern:[['none','Uni'],['spots','Taches'],['stripes','Rayures'],['belly','Ventre'],['gradient','Dégradé']],
 eyes:[['round','Ronds'],['big','Gros'],['cyclops','Cyclope'],['three','Trois'],['dots','Points'],['star','Étoiles'],['sleepy','Endormis'],['happy','Heureux']],
 mouth:[['smile','Sourire'],['open','Ouverte'],['teeth','Dents'],['tongue','Langue'],['cat','Chat'],['o','Petit O'],['fangs','Crocs'],['beak','Bec']],
 ears:[['none','Aucune'],['cat','Chat'],['round','Ours'],['bunny','Lapin'],['elf','Elfe'],['fin','Nageoires'],['floppy','Chien']],
 horns:[['none','Aucune'],['devil','Diable'],['bull','Taureau'],['antenna','Antennes'],['unicorn','Licorne'],['spikes','Piques']],
 arms:[['none','Aucun'],['stick','Bâtons'],['noodle','Nouilles'],['claws','Griffes'],['tiny','Moignons'],['tentacle','Tentacules'],['mitts','Moufles']],
 legs:[['none','Aucune'],['stick','Fines'],['stubby','Courtes'],['paw','Pattes'],['spring','Ressorts'],['tentacle','Tentacules'],['boots','Bottes']],
 wings:[['none','Aucune'],['bat','Chauve-souris'],['angel','Ange'],['butterfly','Papillon'],['fairy','Fée'],['tiny','Petites']],
 'acc.head':[['none','Aucun'],['crown','Couronne'],['tophat','Haut-de-forme'],['partyhat','Fête'],['wizard','Magicien'],['cap','Casquette'],['flower','Fleur'],['halo','Auréole'],['chef','Toque']],
 'acc.face':[['none','Aucun'],['glasses','Lunettes'],['sunglasses','Soleil'],['monocle','Monocle'],['mustache','Moustache'],['mask','Masque'],['eyepatch','Pirate']],
 'acc.neck':[['none','Aucun'],['bow','Nœud'],['scarf','Écharpe'],['tie','Cravate'],['necklace','Collier'],['medal','Médaille']]
};
const PATHS=Object.keys(OPT);
const GROUPS=[
 {id:'body',ico:'🟣',n:'Corps',secs:[
  {p:'shape',n:'Forme',crop:'15 40 170 200'},{p:'pattern',n:'Motif',crop:'15 40 170 200'},
  {col:'color',n:'Couleur principale'},{col:'color2',n:'Couleur secondaire (motifs, cornes, ailes…)'}]},
 {id:'face',ico:'👀',n:'Visage',secs:[
  {p:'eyes',n:'Yeux',crop:'48 74 104 84'},{p:'mouth',n:'Bouche',crop:'58 126 84 68'},
  {tg:'blush',n:'🌸 Joues roses'},{tg:'freckles',n:'✨ Taches de rousseur'}]},
 {id:'head',ico:'🦄',n:'Tête',secs:[
  {p:'ears',n:'Oreilles',crop:'0 30 200 120'},{p:'horns',n:'Cornes',crop:'30 15 140 100'}]},
 {id:'limbs',ico:'🦵',n:'Membres',secs:[
  {p:'arms',n:'Bras',crop:'0 100 200 110'},{p:'legs',n:'Jambes',crop:'20 165 160 75'},{p:'wings',n:'Ailes',crop:'0 35 200 150'}]},
 {id:'acc',ico:'👑',n:'Accessoires',secs:[
  {p:'acc.head',n:'Sur la tête',crop:'35 -8 130 100'},{p:'acc.face',n:'Sur le visage',crop:'35 80 130 100'},{p:'acc.neck',n:'Autour du cou',crop:'35 135 130 90'}]}
];
const INK='#2b1d3a';
const D={eyeY:118,mouthY:152,earX:56,earY:84,hornX:30,hornY:64,armX:68,armY:140,legX:30,legY:196,wingX:62,wingY:125,hatY:60,neckY:180,eyeDX:25};
const SHAPES={
 round:{path:'M30 130A70 70 0 1 0 170 130A70 70 0 1 0 30 130Z',a:{}},
 blob:{path:'M40 140C30 90 70 62 100 62C135 62 172 90 160 140C168 180 140 202 100 202C60 202 32 180 40 140Z',a:{armX:70,earX:58,earY:86,hatY:62}},
 egg:{path:'M100 56C150 56 165 130 160 160C155 195 130 204 100 204C70 204 45 195 40 160C35 130 50 56 100 56Z',a:{earX:38,earY:82,hornX:16,hornY:62,armX:60,armY:145,hatY:56,legX:28,eyeY:122,mouthY:156,eyeDX:22,wingX:56}},
 square:{path:'M72 64H128A34 34 0 0 1 162 98V166A34 34 0 0 1 128 200H72A34 34 0 0 1 38 166V98A34 34 0 0 1 72 64Z',a:{earX:56,earY:78,hornX:34,armX:62,hatY:64,legX:34,eyeY:120,mouthY:154,eyeDX:28,legY:198,wingX:58}},
 cone:{path:'M100 52C115 52 128 70 150 120C168 160 175 200 150 204L50 204C25 200 32 160 50 120C72 70 85 52 100 52Z',a:{earX:36,earY:96,hornX:14,hornY:60,armX:56,armY:165,hatY:52,eyeY:128,mouthY:160,legX:34,legY:202,wingX:48,wingY:150,eyeDX:20,neckY:186}},
 bean:{path:'M62 70C62 52 138 52 138 70L146 170C146 205 54 205 54 170Z',a:{earX:44,earY:78,hornX:22,hornY:60,armX:48,armY:140,hatY:56,legX:26,legY:200,eyeY:110,mouthY:146,eyeDX:20,wingX:48,wingY:120}}
};

/* ---------- 3. Dessin des créatures ---------- */
const EYES={
 round:(x,y,r=12,pr=6.5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="2.5"/><g class="pupil"><circle cx="${x}" cy="${y+1}" r="${pr}" fill="${INK}"/><circle cx="${x+pr*.35}" cy="${y-pr*.3}" r="${(pr/3.2).toFixed(1)}" fill="#fff"/></g>`,
 big:(x,y)=>EYES.round(x,y,16,9),
 cyclops:(x,y)=>EYES.round(x,y,23,12),
 three:(x,y)=>EYES.round(x,y,10,5.5),
 dots:(x,y)=>`<circle cx="${x}" cy="${y}" r="6" fill="${INK}"/><circle cx="${x+2}" cy="${y-2}" r="2" fill="#fff"/>`,
 star:(x,y)=>`<polygon points="${star(x,y,16,7.5)}" fill="#ffd93d" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><g class="pupil"><circle cx="${x}" cy="${y+1}" r="3.2" fill="${INK}"/></g>`,
 sleepy:(x,y)=>EYES.round(x,y,12,6.5)+`<path d="M${x-12} ${y}A12 12 0 0 1 ${x+12} ${y}Z" fill="#8a7a9a" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`,
 happy:(x,y)=>`<path d="M${x-11} ${y+4}Q${x} ${y-11} ${x+11} ${y+4}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`
};
function flowerSVG(x,y){return [0,72,144,216,288].map(a=>`<circle cx="${(x+9*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(y+9*Math.sin(a*Math.PI/180)).toFixed(1)}" r="6.5" fill="#ff77b7" stroke="${INK}" stroke-width="2"/>`).join('')+`<circle cx="${x}" cy="${y}" r="5" fill="#ffd93d" stroke="${INK}" stroke-width="2"/>`;}

function creatureInner(c,mood,id){
  const sh=SHAPES[c.shape]||SHAPES.round,A=Object.assign({},D,sh.a);
  const col=c.color,c2=c.color2,dark=shade(col,-.2),light=shade(col,.42),c2d=shade(c2,-.25),out=shade(col,-.6);
  const ST=`stroke="${out}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const limb=(d,w)=>`<path d="${d}" fill="none" stroke="${out}" stroke-width="${w+5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${dark}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const pair=(cls,x,y,inner)=>`<g class="${cls}-l"><g transform="translate(${100-x} ${y})">${inner}</g></g><g class="${cls}-r"><g transform="translate(200 0) scale(-1 1)"><g transform="translate(${100-x} ${y})">${inner}</g></g></g>`;

  const EARS={
   cat:()=>`<path d="M-18 16L-12 -28L16 -4Z" fill="${dark}" ${ST}/><path d="M-12 8L-9 -16L6 -3Z" fill="#ffb3c7"/>`,
   round:()=>`<circle cx="-8" cy="-4" r="17" fill="${dark}" ${ST}/><circle cx="-8" cy="-4" r="9" fill="#ffb3c7"/>`,
   bunny:()=>`<g transform="rotate(-22)"><ellipse cx="0" cy="-26" rx="11" ry="30" fill="${dark}" ${ST}/><ellipse cx="0" cy="-26" rx="5" ry="22" fill="#ffb3c7"/></g>`,
   elf:()=>`<path d="M8 8L-40 -14L6 -14Z" fill="${dark}" ${ST}/><path d="M0 2L-26 -8L0 -9Z" fill="#ffb3c7"/>`,
   fin:()=>`<path d="M6 12C-16 16 -30 -2 -28 -26C-16 -14 -8 -14 6 -8Z" fill="${c2}" ${ST}/>`,
   floppy:()=>`<ellipse cx="-14" cy="10" rx="12" ry="24" transform="rotate(25 -14 10)" fill="${dark}" ${ST}/>`
  };
  const HORNS={
   devil:()=>`<path d="M-2 6C-8 -10 -6 -22 -16 -32C2 -28 10 -14 8 6Z" fill="${c2}" ${ST}/>`,
   bull:()=>`<path d="M2 6C-18 4 -30 -6 -28 -26C-20 -12 -8 -10 10 -6Z" fill="${c2}" ${ST}/>`,
   antenna:()=>`<path d="M0 6Q-6 -14 -14 -26" fill="none" stroke="${out}" stroke-width="4" stroke-linecap="round"/><circle cx="-14" cy="-28" r="7" fill="${c2}" ${ST}/>`
  };
  const ARMS={
   stick:()=>limb('M4 0Q-18 -4 -30 18',8)+`<circle cx="-31" cy="20" r="7" fill="${dark}" ${ST}/>`,
   noodle:()=>limb('M4 0C-12 -18 -22 14 -36 -2',9),
   claws:()=>limb('M4 0Q-18 -4 -28 16',8)+`<g transform="translate(-28 16)"><path d="M0 0L-12 6L-2 10ZM0 0L-8 16L2 12ZM0 0L-2 18L8 10Z" fill="#fff" ${ST}/></g>`,
   tiny:()=>`<ellipse cx="-6" cy="6" rx="10" ry="7" transform="rotate(35 -6 6)" fill="${dark}" ${ST}/>`,
   tentacle:()=>limb('M2 0C-18 4 -22 22 -40 20',13)+`<circle cx="-14" cy="9" r="2.5" fill="${light}"/><circle cx="-24" cy="16" r="2.5" fill="${light}"/><circle cx="-33" cy="20" r="2.5" fill="${light}"/>`,
   mitts:()=>limb('M4 0Q-12 0 -22 14',7)+`<circle cx="-26" cy="18" r="12" fill="${c2}" ${ST}/>`
  };
  const LEGS={
   stick:()=>limb('M0 0V22',8)+`<ellipse cx="-4" cy="26" rx="11" ry="5.5" fill="${dark}" ${ST}/>`,
   stubby:()=>`<rect x="-11" y="-4" width="22" height="26" rx="9" fill="${dark}" ${ST}/><ellipse cx="-3" cy="24" rx="14" ry="7" fill="${dark}" ${ST}/>`,
   paw:()=>`<circle cx="0" cy="12" r="14" fill="${dark}" ${ST}/><circle cx="-8" cy="9" r="3.5" fill="${light}"/><circle cx="0" cy="5" r="3.5" fill="${light}"/><circle cx="8" cy="9" r="3.5" fill="${light}"/>`,
   spring:()=>limb('M0 0L-9 6L9 12L-9 18L9 24L0 30',5)+`<ellipse cx="0" cy="32" rx="10" ry="4.5" fill="${dark}" ${ST}/>`,
   tentacle:()=>limb('M0 0C-10 14 10 20 -6 32',11),
   boots:()=>`<rect x="-12" y="-2" width="24" height="24" rx="6" fill="${c2}" ${ST}/><rect x="-16" y="20" width="32" height="9" rx="4" fill="${INK}"/>`
  };
  const WINGS={
   bat:()=>`<path d="M2 0C-20 -34 -52 -42 -74 -22C-62 -22 -58 -12 -56 -4C-50 -12 -40 -10 -36 -2C-28 -8 -16 -6 2 14Z" fill="${c2}" ${ST}/>`,
   angel:()=>`<path d="M2 0C-24 -46 -66 -48 -82 -18C-70 -22 -62 -16 -56 -12C-62 -6 -52 2 -44 2C-48 10 -34 16 -22 14C-18 20 -6 20 2 16Z" fill="#fff" ${ST}/>`,
   butterfly:()=>`<ellipse cx="-34" cy="-22" rx="34" ry="22" transform="rotate(-24 -34 -22)" fill="${c2}" ${ST}/><ellipse cx="-24" cy="14" rx="22" ry="15" transform="rotate(20 -24 14)" fill="${c2d}" ${ST}/><circle cx="-40" cy="-24" r="6" fill="#fff" opacity=".8"/>`,
   fairy:()=>`<ellipse cx="-30" cy="-26" rx="26" ry="14" transform="rotate(-35 -30 -26)" fill="#fff" fill-opacity=".6" ${ST}/><ellipse cx="-22" cy="4" rx="18" ry="10" transform="rotate(25 -22 4)" fill="#fff" fill-opacity=".6" ${ST}/>`,
   tiny:()=>`<ellipse cx="-14" cy="-6" rx="16" ry="9" transform="rotate(-30 -14 -6)" fill="${c2}" ${ST}/>`
  };

  // yeux, bouche
  const dx=A.eyeDX,ey=A.eyeY,my=A.mouthY;
  const pos=c.eyes==='cyclops'?[[100,ey]]:[[100-dx,ey],[100+dx,ey]];
  if(c.eyes==='three')pos.push([100,ey-27]);
  const P2=pos.slice(0,2),cy=c.eyes==='cyclops';
  const w=cy?17:11;
  const eyeAt=(x,y)=>{
    if(mood==='sleep')return `<path d="M${x-w} ${y}Q${x} ${y+11} ${x+w} ${y}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    if(mood==='laugh')return `<path d="M${x-w} ${y+4}Q${x} ${y-11} ${x+w} ${y+4}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    return EYES[c.eyes](x,y);
  };
  const brow=(x,y)=>{
    if(x===100)return `<path d="M${x-20} ${y-33}L${x} ${y-26}L${x+20} ${y-33}" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    const s=x<100?1:-1;
    return `<path d="M${x-13*s} ${y-23}L${x+11*s} ${y-14}" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round"/>`;
  };
  const smile=`<path d="M80 ${my}Q100 ${my+24} 120 ${my}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
  const MOUTH={
   smile:()=>smile,
   open:()=>`<path d="M80 ${my-2}Q100 ${my+40} 120 ${my-2}Z" fill="${INK}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><ellipse cx="100" cy="${my+15}" rx="9" ry="5.5" fill="#ff6f91"/>`,
   teeth:()=>`<path d="M76 ${my-2}Q100 ${my+36} 124 ${my-2}Z" fill="${INK}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M82 ${my}L88 ${my+9}L94 ${my+1}L100 ${my+10}L106 ${my+1}L112 ${my+9}L118 ${my}Z" fill="#fff"/>`,
   tongue:()=>smile+`<path d="M95 ${my+13}v10a6 6 0 0 0 12 0v-10Z" fill="#ff6f91" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`,
   cat:()=>`<path d="M80 ${my}Q90 ${my+13} 100 ${my}Q110 ${my+13} 120 ${my}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M94 ${my-11}H106L100 ${my-3}Z" fill="#ff6f91" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`,
   o:()=>`<ellipse cx="100" cy="${my+6}" rx="8" ry="10" fill="${INK}"/>`,
   fangs:()=>smile+`<path d="M86 ${my+7}L90 ${my+19}L96 ${my+10}ZM104 ${my+10}L110 ${my+19}L114 ${my+7}Z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`,
   beak:()=>`<path d="M86 ${my-6}Q100 ${my-12} 114 ${my-6}L100 ${my+14}Z" fill="#ffb02e" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M89 ${my-3}Q100 ${my} 111 ${my-3}" fill="none" stroke="${INK}" stroke-width="2"/>`
  };
  let mouth;
  if(mood==='laugh')mouth=`<path d="M72 ${my-6}Q100 ${my+48} 128 ${my-6}Z" fill="${INK}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><ellipse cx="100" cy="${my+19}" rx="14" ry="8" fill="#ff6f91"/>`;
  else if(mood==='angry')mouth=`<path d="M76 ${my+8}Q100 ${my-12} 124 ${my+8}Z" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M88 ${my}L92 ${my+7}L96 ${my-1}ZM104 ${my-1}L108 ${my+7}L112 ${my}Z" fill="#fff"/>`;
  else if(mood==='sleep')mouth=`<ellipse cx="100" cy="${my+6}" rx="6" ry="5" fill="${INK}" opacity=".8"/>`;
  else mouth=MOUTH[c.mouth]();

  // assemblage (de l'arrière vers l'avant)
  let s='<defs>';
  if(c.pattern==='gradient')s+=`<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
  s+=`<clipPath id="${id}b"><path d="${sh.path}"/></clipPath></defs>`;
  s+=`<ellipse class="shadow" cx="100" cy="231" rx="54" ry="8" fill="#000" opacity=".16"/><g class="cr">`;
  if(c.wings!=='none')s+=pair('wing',A.wingX,A.wingY,WINGS[c.wings]());
  if(c.ears!=='none')s+=pair('ear',A.earX,A.earY,EARS[c.ears]());
  if(c.horns==='unicorn')s+=`<g transform="translate(100 ${A.hornY+6})"><path d="M-9 0L0 -46L9 0Z" fill="#fff3b0" ${ST}/><path d="M-6 -12L6 -16M-4 -26L4 -30" stroke="#ffb703" stroke-width="3" stroke-linecap="round"/></g>`;

function creatureSVG(c,mood,o){

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,d,type,v,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
const SFX={
 pop:()=>tone(500,0,.12,'triangle',.18,900),
 boing:()=>tone(180,0,.35,'sine',.25,520),
 magic:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.25,'triangle',.14)),
 save:()=>{tone(660,0,.12,'square',.07);tone(990,.1,.2,'square',.07);},
 giggle:()=>[0,.1,.2,.3].forEach((t,i)=>tone(700+(i%2)*200,t,.09,'square',.06)),
 grr:()=>tone(110,0,.5,'sawtooth',.1,70),
 snore:()=>tone(220,0,.9,'sine',.1,120),
 dance:()=>[392,523,659,523].forEach((f,i)=>tone(f,i*.14,.12,'triangle',.14)),
 oops:()=>tone(300,0,.2,'sawtooth',.07,150)
};
function sfx(n){if(S.sound&&SFX[n]){try{SFX[n]();}catch(e){}}}
function burst(x,y,list,n){n=n||10;const fx=$('#fx');for(let i=0;i<n;i++){const e=document.createElement('span');e.className='fx';e.textContent=pick(list);const a=Math.random()*Math.PI*2,r=60+Math.random()*90;e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-60}px;font-size:${16+Math.random()*18}px`;fx.appendChild(e);setTimeout(()=>e.remove(),1300);}}
function burstAt(el,list,n){if(!el)return;const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,list,n);}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* Fenêtres */
function modal(o){

const KEY='patacrea:v1';
const S={creatures:[],world:null,cur:null,dirty:false,mood:'idle',view:'create',sound:true,sel:null,newId:null,fa:null,fb:null,fres:null,fusing:false,reveal:false};
const sig=c=>JSON.stringify(Object.assign({},c,{id:0,t:0,name:0}));
const same=(a,b)=>JSON.stringify(Object.assign({},a,{t:0}))===JSON.stringify(Object.assign({},b,{t:0}));

function defaultCreature(){return {id:uid(),name:randName(),shape:'blob',pattern:'none',color:'#8bd450',color2:'#ffd93d',eyes:'round',mouth:'smile',ears:'none',horns:'none',arms:'none',legs:'stubby',wings:'none',blush:false,freckles:false,acc:{head:'none',face:'none',neck:'none'},t:0};}
function norm(c){
  const o=defaultCreature();if(!c||typeof c!=='object')return o;
  if(typeof c.id==='string'&&c.id)o.id=c.id.slice(0,40);
  o.name=String(c.name||o.name).slice(0,18);
  PATHS.forEach(p=>{const v=get(c,p);if(OPT[p].some(x=>x[0]===v))set(o,p,v);});
  ['color','color2'].forEach(k=>{if(typeof c[k]==='string'&&/^#[0-9a-f]{6}$/i.test(c[k]))o[k]=c[k];});
  o.blush=!!c.blush;o.freckles=!!c.freckles;o.t=+c.t||0;
  return o;
}
function randomCreature(){
  const c=defaultCreature();c.name=randName();
  PATHS.forEach(p=>{const list=OPT[p].map(x=>x[0]);let v=pick(list);if(v==='none'&&Math.random()<.4)v=pick(list.filter(x=>x!=='none'));set(c,p,v);});
  c.color=pick(PALETTE);c.color2=pick(PALETTE.filter(x=>x!==c.color));
  c.blush=Math.random()<.4;c.freckles=Math.random()<.2;
  if(c.pattern==='none'&&Math.random()<.4)c.pattern=pick(['spots','stripes','belly']);
  return c;
}
let warned=false,saveT;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({creatures:S.creatures,world:S.world,draft:S.cur,sound:S.sound}));}
  catch(e){if(!warned){warned=true;toast('⚠️ Sauvegarde locale impossible (navigation privée ?). Pense à télécharger ta sauvegarde.');}}
}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,300);}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  S.creatures=d&&Array.isArray(d.creatures)?d.creatures.slice(0,300).map(norm):[];
  S.world=d&&d.world?normWorld(d.world):starterWorld();
  S.cur=d&&d.draft?norm(d.draft):defaultCreature();
  S.sound=!(d&&d.sound===false);
  const saved=S.creatures.find(c=>c.id===S.cur.id);
  S.dirty=d&&d.draft?(saved?!same(saved,S.cur):sig(S.cur)!==sig(defaultCreature())):false;
}
function addToCollection(c){
  const d=clone(c);d.t=Date.now();
  const i=S.creatures.findIndex(x=>x.id===d.id);
  if(i>=0)S.creatures[i]=d;else S.creatures.unshift(d);
  save();updateBadge();return i>=0;
}

const MOODFX={dance:['dance',['🎵','🎶','✨','💃']],jump:['boing',['⭐','✨','💫']],sleep:['snore',['💤','🌙']],laugh:['giggle',['😂','🤣','✨']],angry:['grr',['💢','🔥','😡']]};

function fuse(a,b){
  const r=defaultCreature();
  ['shape','pattern','eyes','mouth','ears','horns','arms','legs','wings','acc.head','acc.face','acc.neck'].forEach(p=>set(r,p,Math.random()<.5?get(a,p):get(b,p)));
  r.blush=Math.random()<.5?a.blush:b.blush;r.freckles=Math.random()<.5?a.freckles:b.freckles;
  r.color=mix(a.color,b.color,rnd(.35,.65));
  r.color2=Math.random()<.5?mix(a.color2,b.color2,.5):mix(a.color,b.color2,.5);
  r.name=fuseName(a.name,b.name);
  return r;
}

  if(!S.fa)S.fa=clone(S.cur);

    <button class="btn small purple" id="fAgain">🔁 Refaire</button><button class="btn small blue" id="fPng">🖼️ Image</button></div>`;
}

function normWorld(w){

function worldMarkup(w,newId){

  [...w.items].sort((a,b)=>depth(a)-depth(b)).forEach(it=>{

function addItem(k,c){
  if(S.world.items.length>=150){toast('Ton monde est plein ! 🌍');return null;}
  const H=THEMES[S.world.theme].H,sky=k==='cloud'||k==='balloon';
  const it=mkItem(k,Math.round(rnd(160,640)),Math.round(sky?rnd(70,170):k==='rainbow'?H+10:rnd(H+50,H+230)),1,c?clone(c):null);
  it.f=k!=='creature'&&Math.random()<.5;
  S.world.items.push(it);S.sel=it.id;S.newId=it.id;renderWorld();sfx('pop');saveSoon();return it;

function randomWorld(){
  const th=pick(Object.keys(THEMES)),T=THEMES[th],items=[],H=T.H;
  const place=(k,c)=>{const y=rnd(H+30,500);const s=(.75+(y-H)/260*.55)*rnd(.9,1.15);const it=mkItem(k,Math.round(rnd(40,760)),Math.round(y),+s.toFixed(2),c?clone(c):null);it.f=!c&&Math.random()<.5;items.push(it);};
  for(let i=0;i<14;i++)place(pick(T.deco));
  for(let i=0;i<3;i++)items.push(mkItem('cloud',Math.round(rnd(60,740)),Math.round(rnd(70,160)),+rnd(.8,1.3).toFixed(2)));
  if(Math.random()<.5)items.push(mkItem('rainbow',Math.round(rnd(250,550)),H+10,1.2));
  const pool=S.creatures.length?S.creatures.slice().sort(()=>Math.random()-.5).slice(0,3):[S.cur];
  pool.forEach(c=>place('creature',c));

let drag=null;
function svgPt(e){const W=$('#world'),p=W.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(W.getScreenCTM().inverse());}
function bindWorld(){
  const W=$('#world');
  W.addEventListener('pointerdown',e=>{
    const g=e.target.closest('[data-iid]');
    if(!g){S.sel=null;updateRing();updateSelUI();return;}
    const it=S.world.items.find(i=>i.id===g.dataset.iid);if(!it)return;
    e.preventDefault();S.sel=it.id;
    const p=svgPt(e);drag={it,g,ox:it.x-p.x,oy:it.y-p.y,moved:false};
    try{W.setPointerCapture(e.pointerId);}catch(err){}
    updateRing();updateSelUI();
    if(it.k==='creature'){g.classList.add('mood-jump');sfx('boing');setTimeout(()=>g.classList.remove('mood-jump'),800);}
  });
  W.addEventListener('pointermove',e=>{
    if(!drag)return;const p=svgPt(e);
    drag.it.x=Math.round(clamp(p.x+drag.ox,10,790));drag.it.y=Math.round(clamp(p.y+drag.oy,30,515));drag.moved=true;
    drag.g.setAttribute('transform',`translate(${drag.it.x} ${drag.it.y}) scale(${drag.it.f?-drag.it.s:drag.it.s} ${drag.it.s})`);
    updateRing();
  });
  const end=()=>{if(!drag)return;const m=drag.moved;drag=null;if(m){renderWorld();saveSoon();}};
  W.addEventListener('pointerup',end);W.addEventListener('pointercancel',end);
}
function selChange(fn,snd){const it=selItem();if(!it)return;fn(it);renderWorld();saveSoon();if(snd)sfx(snd);}

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function svgToPng(svg,w,h,name){
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    cv.toBlob(b=>{if(!b){toast('Export impossible 😢');return;}download(b,name);toast('Image enregistrée 🖼️');sfx('save');},'image/png');
  };
  img.onerror=()=>toast('Export impossible 😢');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function openExport(c){
  const bgs=[['Transparent',null,'repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 50%/16px 16px'],['Blanc','#ffffff','#fff'],['Soleil','#fff3c4','#fff3c4'],['Ciel','#cdeeff','#cdeeff'],['Bonbon','#ffd6ec','#ffd6ec']];
  const body=modal({title:'Exporter « '+c.name+' » en PNG',html:`<p>Choisis un fond :</p><div class="bgs">${bgs.map((b,i)=>`<button class="bgopt" data-i="${i}" style="background:${b[2]}"><span>${b[0]}</span></button>`).join('')}</div>`,buttons:[{label:'Annuler'}]});
  body.onclick=e=>{const b=e.target.closest('.bgopt');if(!b)return;closeModal();svgToPng(creatureSVG(c,'idle',{exp:true,bg:bgs[+b.dataset.i][1]}),800,1000,'patacrea-'+slug(c.name)+'.png');};
}
function exportWorldPng(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="1600" height="1040">${worldMarkup(S.world)}<text x="790" y="510" text-anchor="end" font-size="14" font-family="sans-serif" font-weight="bold" fill="#000" opacity=".35">PATACREA</text></svg>`;
  svgToPng(svg,1600,1040,'patacrea-monde.png');
}
function exportBackup(){
  const d=new Date().toISOString().slice(0,10);
  const data={app:'patacrea',version:1,exportedAt:new Date().toISOString(),creatures:S.creatures,world:S.world};
  download(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),`patacrea-sauvegarde-${d}.json`);
  toast('Sauvegarde téléchargée ⬇️');
}
function importBackup(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('Lecture du fichier impossible 😢');
  rd.onload=()=>{
    let data;try{data=JSON.parse(rd.result);}catch(e){toast('Ce fichier n’est pas une sauvegarde valide 😢');return;}
    if(!data||data.app!=='patacrea'||!Array.isArray(data.creatures)){toast('Ce fichier n’est pas une sauvegarde PATACREA 😢');return;}
    const list=data.creatures.slice(0,300).map(norm),n=list.length;
    modal({title:'Importer la sauvegarde',html:`<p>Ce fichier contient <b>${n}</b> créature${n>1?'s':''}.</p>`,buttons:[
      {label:'Annuler'},
      {label:'Ajouter à ma collection',cls:'green',fn:()=>{list.forEach(c=>{if(S.creatures.some(x=>x.id===c.id))c.id=uid();S.creatures.unshift(c);});save();updateBadge();renderColl();toast(n+' créature(s) ajoutée(s) 📚');}},
      {label:'Tout remplacer',cls:'orange',fn:()=>{S.creatures=list;if(data.world)S.world=normWorld(data.world);S.sel=null;save();updateBadge();renderColl();toast('Collection remplacée ✅');}}]});
  };
  rd.readAsText(file);
}
function renderColl(){
  const g=$('#cGrid');
  if(!S.creatures.length){g.innerHTML='<div class="empty-state"><div class="big-emoji">🥚</div><p>Ta collection est vide pour l’instant.<br>Crée une créature puis appuie sur « Sauver » !</p><button class="btn green" data-act="goCreate">🎨 Créer ma première créature</button></div>';return;}
  g.innerHTML=S.creatures.map(c=>`<article class="card" data-id="${c.id}"><button class="cthumb" data-act="edit" aria-label="Modifier ${esc(c.name)}">${creatureSVG(c)}</button><h3>${esc(c.name)}</h3><div class="cbtns"><button class="btn" data-act="edit">✏️ Modifier</button><button class="btn" data-act="dup">🧬 Copier</button><button class="btn" data-act="png">🖼️ Image</button><button class="btn" data-act="world">🌳 Au monde</button><button class="btn" data-act="del">🗑️</button></div></article>`).join('');
}
function collAction(act,id){
  const c=S.creatures.find(x=>x.id===id);if(!c)return;
  if(act==='edit')editCreature(id);
  else if(act==='dup'){const d=clone(c);d.id=uid();d.name=(c.name+' 2').slice(0,18);d.t=Date.now();S.creatures.unshift(d);save();updateBadge();renderColl();sfx('pop');toast('Créature copiée 🧬');}
  else if(act==='png')openExport(c);
  else if(act==='world'){go('world');addItem('creature',c);toast(c.name+' est dans ton monde 🌳');}
  else if(act==='del')confirmBox('Supprimer ?',`Veux-tu vraiment supprimer <b>${esc(c.name)}</b> ? Cette action est définitive.`,'Supprimer',()=>{S.creatures=S.creatures.filter(x=>x.id!==id);if(S.cur.id===id)S.dirty=true;save();updateBadge();renderColl();updateSaveBtn();sfx('oops');toast('Créature supprimée');});
}

/* ---------- 10. Démarrage ---------- */
function go(v){
  S.view=v;
  $$('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  $$('#tabs .tabbtn').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  if(v==='create')syncCreate();
  else if(v==='fusion')renderFusion();
  else if(v==='world')renderWorldView();
  else if(v==='coll')renderColl();
  window.scrollTo(0,0);
}
function init(){
  load();
  $('#logo').innerHTML='PATACREA'.split('').map((l,i)=>`<span style="color:${PALETTE[(i*2+1)%PALETTE.length]};animation-delay:${i*.12}s">${l}</span>`).join('');
  const snd=()=>{const b=$('#sndBtn');b.textContent=S.sound?'🔊':'🔇';b.setAttribute('aria-pressed',S.sound);b.setAttribute('aria-label',S.sound?'Son activé':'Son coupé');};
  snd();
  $('#sndBtn').onclick=()=>{S.sound=!S.sound;snd();saveSoon();if(S.sound)sfx('pop');};
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tabbtn');if(b){sfx('pop');go(b.dataset.view);}});
  document.addEventListener('pointerdown',()=>{if(S.sound)ac();},{once:true});

  // Créateur
  $('#nameIn').addEventListener('input',e=>{S.cur.name=e.target.value.slice(0,18);S.dirty=true;saveSoon();});
  $('#nameIn').addEventListener('blur',e=>{if(!e.target.value.trim()){S.cur.name=randName();e.target.value=S.cur.name;}});
  $('#stage').addEventListener('click',stageTap);
  $('#strip').addEventListener('click',e=>{const b=e.target.closest('[data-mood]');if(b)setMood(b.dataset.mood);});
  $('#groupTabs').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;curGroup=b.dataset.g;renderGroupTabs();renderPanel();sfx('pop');});
  $('#panel').addEventListener('click',e=>{
    const t=e.target.closest('.tile');if(t){setCur(t.dataset.p,t.dataset.v);return;}
    const sw=e.target.closest('.sw[data-c]');if(sw){setCur(sw.parentElement.dataset.col,sw.dataset.c);return;}
    const tg=e.target.closest('.tg');if(tg)setCur(tg.dataset.tg,!S.cur[tg.dataset.tg]);
  });
  $('#panel').addEventListener('input',e=>{if(e.target.matches('input[type=color]'))setCur(e.target.dataset.col,e.target.value,true);});
  $('#bRand').onclick=()=>guardDirty(()=>{newCreature(randomCreature());S.dirty=true;sfx('magic');burstAt($('#stage'),['🎲','✨','🌟'],10);});
  $('#bNew').onclick=()=>guardDirty(()=>{newCreature(defaultCreature());sfx('pop');});
  $('#bSave').onclick=saveCur;
  $('#bPng').onclick=()=>openExport(S.cur);
  let lr=0;
  window.addEventListener('pointermove',e=>{
    if(S.view!=='create'||lr)return;
    lr=requestAnimationFrame(()=>{lr=0;const svg=$('#stage svg');if(!svg)return;const r=svg.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.45),d=Math.hypot(dx,dy)||1,m=Math.min(1,d/200)*3.6;look.x=dx/d*m;look.y=dy/d*m;applyLook(svg);});
  });

  // Fusion
  $('#fuseBtn').onclick=doFuse;
  $('#v-fusion').addEventListener('click',e=>{
    const p=e.target.closest('[data-pick]');if(p){pickCreature(p.dataset.pick);return;}
    if(e.target.closest('#fSave')){const upd=addToCollection(S.fres);sfx('save');toast(upd?'Déjà dans ta collection, mise à jour ✅':'Nouveau monstre gardé dans ta collection 📚');return;}
    if(e.target.closest('#fEdit')){const r=clone(S.fres);guardDirty(()=>{S.cur=r;S.dirty=!S.creatures.some(c=>c.id===r.id);S.mood='idle';go('create');saveSoon();});return;}
    if(e.target.closest('#fAgain')){doFuse();return;}
    if(e.target.closest('#fPng'))openExport(S.fres);
  });
  $('#v-fusion').addEventListener('input',e=>{if(e.target.id==='fName'&&S.fres)S.fres.name=e.target.value.slice(0,18);});

  // Monde
  bindWorld();
  $('#themeBar').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(!b)return;S.world.theme=b.dataset.theme;$$('#themeBar .chip').forEach(x=>x.setAttribute('aria-selected',x===b));renderWorld();saveSoon();sfx('pop');});
  $('#palette').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)addItem(b.dataset.add);});
  $('#cPalette').addEventListener('click',e=>{const b=e.target.closest('[data-addc]');if(!b)return;const id=b.dataset.addc,c=id==='cur'?S.cur:S.creatures.find(x=>x.id===id);if(c)addItem('creature',c);});
  $('#sBig').onclick=()=>selChange(it=>{it.s=+clamp(it.s*1.2,.4,3.2).toFixed(2);},'pop');
  $('#sSmall').onclick=()=>selChange(it=>{it.s=+clamp(it.s/1.2,.4,3.2).toFixed(2);},'pop');
  $('#sFlip').onclick=()=>selChange(it=>{it.f=!it.f;},'pop');
  $('#sDup').onclick=()=>{const it=selItem();if(!it)return;if(S.world.items.length>=150){toast('Ton monde est plein ! 🌍');return;}const d=clone(it);d.id=uid();d.x=clamp(it.x+30,10,790);d.y=clamp(it.y+14,30,515);S.world.items.push(d);S.sel=d.id;S.newId=d.id;renderWorld();saveSoon();sfx('pop');};
  $('#sDel').onclick=()=>{const it=selItem();if(!it)return;S.world.items=S.world.items.filter(i=>i.id!==it.id);S.sel=null;renderWorld();saveSoon();sfx('oops');};
  $('#wRand').onclick=()=>{randomWorld();renderWorldView();saveSoon();sfx('magic');toast('Un nouveau monde surprise ! 🌍');};
  $('#wPng').onclick=exportWorldPng;
  $('#wClear').onclick=()=>confirmBox('Tout vider ?','Tous les objets et créatures de ton monde seront retirés.','Tout vider',()=>{S.world.items=[];S.sel=null;renderWorld();saveSoon();sfx('oops');});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();return;}
    if(S.view!=='world'||!S.sel||e.target.closest('input,textarea,button'))return;
    const it=selItem();if(!it)return;
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('#sDel').click();}
    else if(e.key.startsWith('Arrow')){e.preventDefault();const st=e.shiftKey?24:8;if(e.key==='ArrowLeft')it.x=clamp(it.x-st,10,790);if(e.key==='ArrowRight')it.x=clamp(it.x+st,10,790);if(e.key==='ArrowUp')it.y=clamp(it.y-st,30,515);if(e.key==='ArrowDown')it.y=clamp(it.y+st,30,515);renderWorld();saveSoon();}
  });

  // Collection
  $('#cGrid').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='goCreate'){go('create');return;}
    const card=b.closest('.card');if(card)collAction(b.dataset.act,card.dataset.id);
  });
  $('#cExport').onclick=exportBackup;
  $('#cImport').onclick=()=>$('#impFile').click();
  $('#impFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value='';});

  window.addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  updateBadge();go('create');
}
if(typeof document!=='undefined'&&document.getElementById)init();
</script>
</body>
</html>
